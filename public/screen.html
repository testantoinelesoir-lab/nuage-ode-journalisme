<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon ode au journalisme — Projection</title><link rel="stylesheet" href="/style.css"><style>body{overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#243050 0%,#101a35 65%,#0b1228 100%)}main{height:100dvh;display:flex;flex-direction:column;padding:4vh 5vw 3vh}header{text-align:center}header small{font-size:clamp(12px,1.3vw,26px);letter-spacing:.23em;text-transform:uppercase;color:var(--pink)}h1{font-size:clamp(24px,3vw,65px);font-weight:400;margin:.3em 0 0}#cloud{flex:1;min-height:0;position:relative;margin:2vh 0}#cloud span{position:absolute;white-space:nowrap;line-height:1.12;transition:left .7s ease,top .7s ease,font-size .7s ease;transform:translate(-50%,-50%);animation:appear .85s both}@keyframes appear{from{opacity:0;filter:blur(8px);transform:translate(-50%,-50%) scale(.8)}to{opacity:1;filter:blur(0);transform:translate(-50%,-50%) scale(1)}}footer{text-align:center;letter-spacing:.12em;font-size:clamp(12px,1.2vw,24px);color:var(--peach)}#full{position:fixed;right:12px;bottom:10px;opacity:0;font:14px sans-serif}#full:hover,#full:focus{opacity:1}</style><main><header><small>Béatrice Delvaux</small><h1>Mon ode au journalisme</h1></header><div id="cloud" aria-live="polite"></div><footer>LE SOIR &nbsp; · &nbsp; THÉÂTRE NATIONAL</footer></main><button id="full" onclick="document.documentElement.requestFullscreen().catch(()=>{})">Plein écran</button><script>
const cloud=document.querySelector('#cloud');let state={shown:[],size:100};const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');const colors=['#fff2e4','#efa7b7','#f6c4a4','#d7c6ee'];function layout(){const W=cloud.clientWidth,H=cloud.clientHeight,n=state.shown.length;let positions=[];let base=Math.min(H*.23,W*.15)*Math.min(1,Math.sqrt(4/Math.max(1,n)))*state.size/100;for(let attempt=0;attempt<35;attempt++){positions=[];let ok=true;for(let i=0;i<n;i++){let word=state.shown[i],s=Math.max(9,base*(i%4===0?1:i%4===1?.78:.62));ctx.font='500 '+s+'px "STIX Two Text", Georgia';let w=ctx.measureText(word).width+s*.32,h=s*1.25;let found=false;for(let j=0;j<2400;j++){let r=5*Math.sqrt(j),a=j*2.399963;let x=W/2+r*Math.cos(a)*1.8,y=H/2+r*Math.sin(a);if(x-w/2<0||x+w/2>W||y-h/2<0||y+h/2>H)continue;if(positions.some(p=>Math.abs(p.x-x)<(p.w+w)/2&&Math.abs(p.y-y)<(p.h+h)/2))continue;positions.push({word,x,y,w,h,s});found=true;break}if(!found){ok=false;break}}if(ok)break;base*=.9}for(const el of [...cloud.children])if(!state.shown.includes(el.dataset.word))el.remove();positions.forEach((p,i)=>{let el=[...cloud.children].find(e=>e.dataset.word===p.word);if(!el){el=document.createElement('span');el.dataset.word=p.word;el.textContent=p.word;cloud.append(el)}Object.assign(el.style,{left:p.x+'px',top:p.y+'px',fontSize:p.s+'px',fontWeight:500,color:colors[i%4]})})}new EventSource('/events').onmessage=e=>{state=JSON.parse(e.data);layout()};window.addEventListener('resize',layout);document.fonts.ready.then(layout);</script></html>
