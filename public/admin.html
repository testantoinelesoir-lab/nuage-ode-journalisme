<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Régie — Mon ode au journalisme</title><link rel="stylesheet" href="/style.css"><style>body{max-width:760px;margin:auto;padding:20px;font-family:system-ui,sans-serif}h1{font:36px 'STIX Two Text',Georgia;margin:8px 0}small{color:#efa7b7}section{border:1px solid #ffffff20;border-radius:12px;padding:16px;margin:16px 0}textarea{width:100%;min-height:110px}#words{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}#words button{min-height:62px;overflow-wrap:anywhere;font-weight:600}#words button.active{background:#efa7b7;color:#101a35}#status{font-size:14px}a{color:var(--peach)}.actions{display:flex;gap:8px;flex-wrap:wrap}label{display:block;margin:10px 0}input[type=range]{width:100%}</style><small>RÉGIE · 3 DÉCEMBRE 2026</small><h1>Mon ode au journalisme</h1><p id="status">Connexion…</p><section id="login"><label>Code régie <input id="pin" type="password" autocomplete="current-password"></label><button onclick="auth()">Accéder</button></section><div id="panel" hidden><section><strong id="count"></strong><p>Touchez un mot pour l’afficher. Touchez-le à nouveau pour le retirer.</p><div id="words"></div></section><section class="actions"><button onclick="act('undo')">Annuler le dernier mot</button><button onclick="if(confirm('Effacer tous les mots projetés ?'))act('reset')">Vider la projection</button><a href="/" target="_blank">Ouvrir la projection ↗</a></section><section><label>Ajouter un mot imprévu</label><div class="actions"><input id="extra" placeholder="Nouveau mot"><button onclick="add()">Ajouter</button></div><details open><summary>Préparer la liste des mots</summary><p>Un mot ou une expression par ligne.</p><textarea id="list"></textarea><button onclick="save()">Enregistrer la liste</button></details><label>Taille globale <input id="size" type="range" min="60" max="120" value="100" onchange="act('size',{size:this.value})"></label></section></div><script>
let state={words:[],shown:[],size:100},busy=false,code=sessionStorage.getItem('ode-pin')||'';const $=id=>document.getElementById(id);$('pin').value=code;const es=new EventSource('/events');es.onopen=()=>{$('status').textContent='● Projection synchronisée';if(!$('panel').hidden)act('auth')};es.onerror=()=>{$('status').textContent='⚠ Connexion interrompue — reconnexion automatique'};es.onmessage=e=>{Object.assign(state,JSON.parse(e.data));render()};function render(){$('count').textContent=state.shown.length+' / '+state.words.length+' mots affichés';$('size').value=state.size;const box=$('words');box.replaceChildren();for(const word of state.words){const b=document.createElement('button');b.textContent=(state.shown.includes(word)?'✓  ':'')+word;b.className=state.shown.includes(word)?'active':'';b.setAttribute('aria-pressed',state.shown.includes(word));b.onclick=()=>act('toggle',{word});box.append(b)}}async function act(action,extra={}){if(busy)return false;busy=true;try{const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:code,action,...extra})});const d=await r.json();if(!r.ok)throw Error(d.error);state=d;render();return true}catch(e){alert(e.message);return false}finally{busy=false}}async function auth(){code=$('pin').value;if(await act('auth')){sessionStorage.setItem('ode-pin',code);$('login').hidden=true;$('panel').hidden=false;$('list').value=state.words.join('\n')}}async function save(){await act('list',{words:$('list').value.split('\n')})}async function add(){let w=$('extra').value.trim();if(w&&await act('list',{words:[...state.words,w]})){$('extra').value='';$('list').value=state.words.join('\n')}}if(code)auth();</script></html>
